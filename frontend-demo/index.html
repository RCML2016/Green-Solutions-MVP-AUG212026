
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Green Solutions | AI Sustainability Intelligence</title>

    <meta
        name="description"
        content="Green Solutions AI-powered sustainability intelligence platform."
    >

    <link rel="stylesheet" href="styles.css">
</head>

<body>

<div class="app-shell">

    <!-- =========================================================
         SIDEBAR
    ========================================================== -->

    <aside class="sidebar">

        <div class="brand">

            <div class="brand-mark">
                ✦
            </div>

            <div class="brand-text">
                <div class="brand-name">
                    Green Solutions
                </div>

                <div class="brand-subtitle">
                    AI Sustainability Intelligence
                </div>
            </div>

        </div>


        <!-- Workspace -->

        <div class="workspace-section">

            <div class="section-label">
                WORKSPACE
            </div>

            <div class="workspace-card">

                <div class="workspace-icon">
                    GS
                </div>

                <div class="workspace-info">

                    <strong>
                        Solar Portfolio
                    </strong>

                    <small>
                        Enterprise Demo
                    </small>

                </div>

                <div class="workspace-arrow">
                    ⌄
                </div>

            </div>

        </div>


        <!-- Navigation -->

        <nav class="main-nav">

            <button
                class="nav-item active"
                data-page="overview"
            >
                <span class="nav-icon">⌂</span>
                <span>Overview</span>
            </button>


            <button
                class="nav-item"
                data-page="intelligence"
            >
                <span class="nav-icon">✦</span>
                <span>AI Intelligence</span>
            </button>


            <button
                class="nav-item"
                data-page="assets"
            >
                <span class="nav-icon">◉</span>
                <span>Asset 360</span>
            </button>


            <button
                class="nav-item"
                data-page="operations"
            >
                <span class="nav-icon">⚙</span>
                <span>Operations</span>
            </button>


            <button
                class="nav-item"
                data-page="reports"
            >
                <span class="nav-icon">▣</span>
                <span>Reports</span>
            </button>

        </nav>


        <!-- Bottom Sidebar -->

        <div class="sidebar-bottom">

            <div class="copilot-mini">

                <div class="copilot-mini-icon">
                    ✦
                </div>

                <div class="copilot-mini-text">

                    <strong>
                        AI Copilot
                    </strong>

                    <small>
                        Ready to assist
                    </small>

                </div>

                <span class="online-dot"></span>

            </div>


            <div class="user-card">

                <div class="avatar">
                    RC
                </div>

                <div class="user-info">

                    <strong>
                        Portfolio Admin
                    </strong>

                    <small>
                        Enterprise
                    </small>

                </div>

                <button class="user-more">
                    •••
                </button>

            </div>

        </div>

    </aside>


    <!-- =========================================================
         MAIN APPLICATION
    ========================================================== -->

    <main class="main-content">


        <!-- Top Navigation -->

        <header class="topbar">

            <div class="mobile-brand">

                <span class="mobile-brand-mark">
                    ✦
                </span>

                Green Solutions

            </div>


            <div class="breadcrumb">

                <span>
                    Solar Portfolio
                </span>

                <b>
                    /
                </b>

                <strong id="breadcrumb-page">
                    Overview
                </strong>

            </div>


            <div class="topbar-actions">

                <div class="ai-status">

                    <span class="status-dot"></span>

                    AI ENGINE ONLINE

                </div>


                <button
                    class="top-icon"
                    title="Notifications"
                >
                    ◌
                </button>


                <button
                    class="top-icon"
                    title="Settings"
                >
                    ⚙
                </button>

            </div>

        </header>


        <!-- =====================================================
             DYNAMIC CONTENT
        ====================================================== -->

        <section
            id="app-content"
            class="page-content"
        >
        </section>


        <!-- =====================================================
             FOOTER
        ====================================================== -->

        <footer class="footer">

            Green Solutions
            <span>·</span>
            Intelligent Sustainability Platform
            <span>·</span>
            Quick Rollout Demo
            <span>·</span>
            2026

        </footer>

    </main>

</div>


<!-- =========================================================
     TOAST NOTIFICATION
========================================================== -->

<div
    id="toast"
    class="toast"
>
</div>


<!-- =========================================================
     JAVASCRIPT
========================================================== -->

<script src="app.js"></script>

</body>
</html>
